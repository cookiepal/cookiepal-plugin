name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # Plugins install from git with no build step, so the bundle the skill runs is committed.
      - name: Check dist/ matches src/
        run: |
          pnpm build
          # status, not diff: an uncommitted or deleted bundle has to fail too.
          test -z "$(git status --porcelain -- dist/)" || { git status --short -- dist/; echo "::error::dist/ is out of date or not committed. Run pnpm build and commit it."; exit 1; }
      - name: Validate plugin and marketplace manifests
        run: pnpm validate
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox uses; allow them rather than
      # testing with --no-sandbox, which users never run.
      - name: Let Chrome use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The browser tests use the runner's preinstalled Google Chrome, as a user's machine would.
      - name: Test
        run: pnpm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid licence for organisation repos, so run the release binary directly.
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 8.30.1
        run: |
          gh release download "v$VERSION" -R gitleaks/gitleaks \
            -p "gitleaks_${VERSION}_linux_x64.tar.gz" -p "gitleaks_${VERSION}_checksums.txt" -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          grep "linux_x64" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan full history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --verbose'
